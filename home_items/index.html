<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家裡物品定位</title>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#666; --line:#333; --room:#f4f1ea; --hit:#ffe082; --sel:#90caf9; --accent:#b3261e; --card:#fafafa; --border:#ddd; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#17171a; --fg:#eee; --muted:#aaa; --line:#bbb; --room:#2a2a2f; --hit:#8a6d00; --sel:#1e4b78; --accent:#ff8a80; --card:#222228; --border:#444; }
  }
  :root[data-theme="dark"] { --bg:#17171a; --fg:#eee; --muted:#aaa; --line:#bbb; --room:#2a2a2f; --hit:#8a6d00; --sel:#1e4b78; --accent:#ff8a80; --card:#222228; --border:#444; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,"Noto Sans TC",sans-serif; font-size:15px; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 10px; }
  input, select, button, textarea { font:inherit; color:inherit; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--card); }
  button { padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:var(--card); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button.small { padding:4px 8px; font-size:13px; }
  .bar { display:flex; gap:8px; margin-bottom:12px; }
  .bar input { flex:1; }
  svg { width:100%; height:auto; display:block; margin-bottom:12px; }
  .room { fill:var(--room); stroke:var(--line); stroke-width:2; cursor:pointer; }
  .room.hit { fill:var(--hit); }
  .room.sel { fill:var(--sel); }
  .hall { fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:6 4; }
  .num { font-size:22px; font-weight:700; fill:var(--fg); text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .num.small { font-size:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
  .card h2 { font-size:16px; margin:0 0 8px; }
  .item { display:flex; gap:8px; align-items:flex-start; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border); }
  .item:first-of-type { border-top:none; }
  .item .main { flex:1; min-width:0; }
  .item .name { font-weight:700; }
  .item .meta { color:var(--muted); font-size:13px; margin-top:2px; word-break:break-all; }
  .item .actions { display:flex; gap:6px; flex-shrink:0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .full { grid-column:1 / -1; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--accent); font-size:13px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>家裡物品定位</h1>

  <div id="setup" class="card hidden">
    <h2>連線設定</h2>
    <div class="grid">
      <div class="full"><input id="cfgUrl" placeholder="Apps Script 網頁應用程式網址（/exec 結尾）"></div>
      <div class="full"><input id="cfgToken" type="password" placeholder="密碼（與 Script 屬性 TOKEN 相同）"></div>
      <div class="full"><button class="primary" id="cfgSave">儲存並讀取</button></div>
    </div>
    <p class="muted">設定只存在這台裝置的瀏覽器，不會放進網頁原始碼。</p>
  </div>

  <div class="bar">
    <input id="q" type="search" placeholder="搜尋物品、位置或備註">
    <button id="settingsBtn" title="連線設定">⚙</button>
  </div>

  <svg viewBox="60 860 830 550" role="img" aria-label="格局圖">
    <rect class="hall" x="163" y="969" width="400" height="145"/>
    <rect class="room" data-z="1" x="73" y="879" width="90" height="90"/>
    <rect class="room" data-z="2" x="163" y="879" width="109" height="90"/>
    <rect class="room" data-z="3" x="272" y="879" width="127" height="90"/>
    <rect class="room" data-z="4" x="399" y="879" width="37" height="90"/>
    <rect class="room" data-z="5" x="436" y="879" width="127" height="90"/>
    <rect class="room" data-z="6" x="563" y="879" width="91" height="199"/>
    <rect class="room" data-z="7" x="73" y="988" width="90" height="108"/>
    <rect class="room" data-z="8" x="73" y="1096" width="90" height="91"/>
    <rect class="room" data-z="9" x="73" y="1187" width="217" height="200"/>
    <rect class="room" data-z="10" x="290" y="1114" width="236" height="273"/>
    <rect class="room" data-z="11" x="526" y="1114" width="37" height="109"/>
    <rect class="room" data-z="12" x="526" y="1223" width="64" height="109"/>
    <rect class="room" data-z="13" x="590" y="1205" width="64" height="127"/>
    <rect class="room" data-z="14" x="526" y="1332" width="128" height="55"/>
    <rect class="room" data-z="15" x="654" y="1078" width="218" height="309"/>
    <text class="num" x="118" y="924">1</text>
    <text class="num" x="217" y="924">2</text>
    <text class="num" x="335" y="924">3</text>
    <text class="num small" x="417" y="924">4</text>
    <text class="num" x="499" y="924">5</text>
    <text class="num" x="608" y="978">6</text>
    <text class="num" x="118" y="1042">7</text>
    <text class="num" x="118" y="1141">8</text>
    <text class="num" x="181" y="1287">9</text>
    <text class="num" x="408" y="1250">10</text>
    <text class="num small" x="544" y="1168">11</text>
    <text class="num" x="558" y="1277">12</text>
    <text class="num" x="622" y="1268">13</text>
    <text class="num" x="590" y="1359">14</text>
    <text class="num" x="763" y="1232">15</text>
    <text class="num" x="363" y="1041" style="fill:var(--muted)">16</text>
  </svg>

  <div class="card" id="panel">
    <h2 id="panelTitle">點地圖上的區塊，或直接搜尋</h2>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2 id="formTitle">新增物品</h2>
    <div class="grid">
      <input id="fName" class="full" placeholder="物品名稱（必填）">
      <select id="fZone" class="full"></select>
      <input id="fPlace" placeholder="位置說明（例：上層左邊）">
      <input id="fQty" placeholder="數量">
      <input id="fNote" class="full" placeholder="備註">
      <div class="full" style="display:flex; gap:8px;">
        <button class="primary" id="fSave" style="flex:1">新增</button>
        <button id="fCancel" class="hidden">取消</button>
      </div>
      <div class="full err" id="msg"></div>
    </div>
  </div>
</div>

<script>
const ZONES = {
  1: '角落收納空間', 2: '衣櫥', 3: '電腦化妝桌', 4: '冰箱', 5: '流理台',
  6: '入口玄關曬衣架', 7: '書櫃', 8: '收納衣櫃', 9: '地毯區', 10: '床',
  11: '雜物收納區A', 12: '老公用品', 13: '雜物收納區B', 14: '老公衣架',
  15: '廁所浴室', 16: '走道'
};

const KEY = 'home_items_cfg_v1';
let cfg = { url: '', token: '' };
let items = [];
let selZone = null;
let editId = null;

function loadCfg() {
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
}
function saveCfg() {
  try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showMsg(t) { document.getElementById('msg').textContent = t || ''; }

async function api(action, body) {
  if (!cfg.url || !cfg.token) throw new Error('尚未設定連線');
  let res;
  if (action === 'list') {
    res = await fetch(cfg.url + '?token=' + encodeURIComponent(cfg.token));
  } else {
    res = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token: cfg.token }, body))
    });
  }
  const data = await res.json();
  if (!data.ok) throw new Error(data.error === 'unauthorized' ? '密碼錯誤' : (data.error || '失敗'));
  return data;
}

async function reload() {
  try {
    const d = await api('list');
    items = d.items;
    render();
  } catch (e) {
    showMsg(e.message);
    if (e.message === '密碼錯誤' || e.message === '尚未設定連線') {
      document.getElementById('setup').classList.remove('hidden');
    }
  }
}

function matches(it, q) {
  if (!q) return true;
  return [it.name, it.place, it.note, ZONES[it.zone]].join(' ').toLowerCase().includes(q);
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();

  // 地圖：有符合搜尋的區塊標黃，選取的區塊標藍
  const hitZones = new Set(items.filter(it => matches(it, q)).map(it => it.zone));
  document.querySelectorAll('.room').forEach(r => {
    const z = Number(r.dataset.z);
    r.classList.toggle('hit', !!q && hitZones.has(z));
    r.classList.toggle('sel', z === selZone);
  });

  // 清單
  const list = document.getElementById('list');
  const title = document.getElementById('panelTitle');
  let shown;
  if (selZone !== null && !q) {
    title.textContent = selZone + ' · ' + ZONES[selZone];
    shown = items.filter(it => it.zone === selZone);
  } else if (q) {
    title.textContent = '搜尋結果';
    shown = items.filter(it => matches(it, q));
  } else {
    title.textContent = '點地圖上的區塊，或直接搜尋';
    shown = [];
  }

  if (!shown.length) {
    list.innerHTML = '<div class="muted">' + (title.textContent.startsWith('點') ? '' : '目前沒有物品') + '</div>';
  } else {
    list.innerHTML = shown.map(it => `
      <div class="item">
        <div class="main">
          <div class="name">${esc(it.name)}${it.qty ? ' × ' + esc(it.qty) : ''}</div>
          <div class="meta">${q || selZone === null ? esc(it.zone + ' ' + ZONES[it.zone]) + ' · ' : ''}${esc(it.place)}${it.note ? ' · ' + esc(it.note) : ''}</div>
        </div>
        <div class="actions">
          <button class="small" data-edit="${esc(it.id)}">編輯</button>
          <button class="small" data-del="${esc(it.id)}">刪除</button>
        </div>
      </div>`).join('');
  }

  // 表單的區域下拉選單，預設為目前選取的區塊
  const zs = document.getElementById('fZone');
  if (!zs.options.length) {
    zs.innerHTML = Object.keys(ZONES).map(k => `<option value="${k}">${k} · ${ZONES[k]}</option>`).join('');
  }
  if (!editId && selZone !== null) zs.value = String(selZone);
}

document.getElementById('list').addEventListener('click', async e => {
  const edit = e.target.closest('[data-edit]');
  const del = e.target.closest('[data-del]');
  if (edit) {
    const it = items.find(i => i.id === edit.dataset.edit);
    if (!it) return;
    editId = it.id;
    document.getElementById('fName').value = it.name;
    document.getElementById('fZone').value = String(it.zone);
    document.getElementById('fPlace').value = it.place;
    document.getElementById('fQty').value = it.qty;
    document.getElementById('fNote').value = it.note;
    document.getElementById('formTitle').textContent = '編輯物品';
    document.getElementById('fSave').textContent = '儲存修改';
    document.getElementById('fCancel').classList.remove('hidden');
    document.getElementById('fName').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (del) {
    const it = items.find(i => i.id === del.dataset.del);
    if (!it || !confirm('刪除「' + it.name + '」？')) return;
    try { await api('delete', { id: it.id }); await reload(); }
    catch (err) { showMsg(err.message); }
  }
});

document.querySelector('svg').addEventListener('click', e => {
  const r = e.target.closest('.room');
  if (!r) return;
  const z = Number(r.dataset.z);
  selZone = selZone === z ? null : z;
  document.getElementById('q').value = '';
  render();
});

document.getElementById('q').addEventListener('input', render);

function resetForm() {
  editId = null;
  ['fName', 'fPlace', 'fQty', 'fNote'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('formTitle').textContent = '新增物品';
  document.getElementById('fSave').textContent = '新增';
  document.getElementById('fCancel').classList.add('hidden');
  showMsg('');
  render();
}

document.getElementById('fCancel').addEventListener('click', resetForm);

document.getElementById('fSave').addEventListener('click', async () => {
  const body = {
    name: document.getElementById('fName').value.trim(),
    zone: Number(document.getElementById('fZone').value),
    place: document.getElementById('fPlace').value.trim(),
    qty: document.getElementById('fQty').value.trim(),
    note: document.getElementById('fNote').value.trim()
  };
  if (!body.name) { showMsg('請輸入物品名稱'); return; }
  const btn = document.getElementById('fSave');
  btn.disabled = true;
  try {
    if (editId) await api('update', Object.assign({ id: editId }, body));
    else await api('add', body);
    resetForm();
    await reload();
  } catch (err) {
    showMsg(err.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('cfgUrl').value = cfg.url;
  document.getElementById('cfgToken').value = cfg.token;
  document.getElementById('setup').classList.toggle('hidden');
});

document.getElementById('cfgSave').addEventListener('click', async () => {
  cfg.url = document.getElementById('cfgUrl').value.trim();
  cfg.token = document.getElementById('cfgToken').value.trim();
  saveCfg();
  document.getElementById('setup').classList.add('hidden');
  await reload();
});

loadCfg();
if (!cfg.url || !cfg.token) document.getElementById('setup').classList.remove('hidden');
reload();
</script>
</body>
</html>
