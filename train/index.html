<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>火車時刻</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #131c2e;
    --text: #f1f5f9;
    --sub: #94a3b8;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #38bdf8;
    --accent-2: #facc15;
    --danger: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #64748b;
      --line: rgba(15, 23, 42, 0.08);
      --accent: #0284c7;
      --accent-2: #b45309;
      --danger: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
  .top h1 { margin: 0; font-size: 1.35rem; }
  .today { color: var(--sub); font-size: 0.85rem; }
  .updated { color: var(--sub); font-size: 0.78rem; margin: 0 0 12px; min-height: 1em; }

  .routes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .route-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 6px 6px 14px; font-size: 0.9rem; color: var(--text); cursor: pointer;
  }
  .route-chip.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .route-chip .del {
    border: 0; background: transparent; color: var(--sub); font-size: 1rem; line-height: 1;
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
  }
  .route-chip .del:hover { color: var(--danger); background: var(--line); }
  .route-chip .mv {
    border: 0; background: transparent; color: var(--sub); font-size: 1rem; line-height: 1;
    width: 22px; height: 24px; border-radius: 50%; cursor: pointer;
  }
  .route-chip .mv:hover:not(:disabled) { color: var(--accent); background: var(--line); }
  .route-chip .mv:disabled { opacity: 0.3; cursor: default; }

  .add-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; margin-bottom: 14px;
  }
  .add-row { display: flex; align-items: center; gap: 8px; }
  .add-row select {
    flex: 1; min-width: 0; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 0.95rem;
  }
  .arrow { color: var(--sub); }
  .btn {
    margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .msg { margin-top: 8px; font-size: 0.85rem; color: var(--danger); min-height: 1em; }

  .status { text-align: center; color: var(--sub); padding: 30px 10px; font-size: 0.95rem; }

  .next {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(250, 204, 21, 0.12));
    border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px;
  }
  .next .label { font-size: 0.8rem; color: var(--sub); }
  .next .meta { font-size: 0.9rem; color: var(--sub); }
  .next .countdown { color: var(--accent-2); font-weight: 700; }
  .next .up-row { padding: 10px 0; border-top: 1px solid var(--line); }
  .next .up-row:first-of-type { border-top: 0; padding-top: 4px; }
  .next .up-row.first .up-time { font-size: 1.8rem; }
  .next .up-time { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .next .up-arr { font-size: 0.95rem; color: var(--sub); font-weight: 400; }
  .next .prev-row { padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px dashed var(--line); }
  .next .prev-line { font-size: 0.9rem; color: var(--sub); margin-top: 2px; }
  .next .prev-line .up-time { font-size: 1rem; color: var(--sub); }
  .next .btn-link {
    margin-top: 10px; border: 0; background: transparent; color: var(--accent);
    font-size: 0.95rem; font-weight: 600; padding: 4px 0; cursor: pointer;
  }

  .daybar { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .daybar .step {
    width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 1.1rem; cursor: pointer;
  }
  .daybar .step:disabled { opacity: 0.3; cursor: default; }
  .daybar input[type="date"] {
    flex: 1; min-width: 0; height: 36px; padding: 0 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 0.95rem;
  }
  .daybar .today-btn {
    height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--accent); font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .daybar .today-btn:disabled { color: var(--sub); opacity: 0.5; cursor: default; }

  .types { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    border-radius: 999px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer;
  }
  .chip.on { color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .train {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    cursor: pointer;
  }
  .train.open { border-color: var(--accent); }
  .train.past { opacity: 0.45; }
  .train.next-one { border-color: var(--accent); }
  .train.suspended { opacity: 0.5; }
  .train .no { font-weight: 700; font-size: 0.95rem; }
  .train .type { font-size: 0.78rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .train .times { font-variant-numeric: tabular-nums; font-size: 1.05rem; font-weight: 600; text-align: right; white-space: nowrap; }
  .train .actual { font-size: 0.75rem; color: var(--sub); font-weight: 400; }
  .stops {
    grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stop { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  .stop.end { color: var(--text); font-weight: 700; }
  .empty { text-align: center; color: var(--sub); padding: 24px 10px; }
  .delay { font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
  .delay.late { color: var(--danger); }
  .delay.ontime { color: #22c55e; }
  .delay.nodata { color: var(--sub); font-weight: 400; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>火車時刻</h1>
    <span id="today" class="today"></span>
  </header>
  <div id="updated" class="updated"></div>

  <section id="routes" class="routes" aria-label="路線"></section>

  <section class="add-card" aria-label="新增路線">
    <div class="add-row">
      <select id="fromSel" aria-label="出發站"></select>
      <span class="arrow">→</span>
      <select id="toSel" aria-label="到達站"></select>
    </div>
    <button id="addBtn" class="btn" type="button">新增路線</button>
    <div id="msg" class="msg"></div>
  </section>

  <div id="status" class="status">載入中…</div>
  <section class="daybar" aria-label="選擇日期">
    <button id="dayPrev" class="step" type="button" aria-label="前一天">‹</button>
    <input id="dayPick" type="date" aria-label="選擇日期">
    <button id="dayNext" class="step" type="button" aria-label="後一天">›</button>
    <button id="dayToday" class="today-btn" type="button">今天</button>
  </section>
  <section id="next" class="next" hidden></section>
  <section id="types" class="types" aria-label="車種篩選"></section>
  <section id="list" class="list"></section>
</div>

<script>
(function () {
  const API = 'https://train-api.simon6314.workers.dev';
  const KEY_ROUTES = 'train_routes_v1';
  const KEY_STATIONS = 'train_stations_v1';
  // 預設路線（站代碼）：竹南 1250、臺北 1000、臺中 3300
  const DEFAULT_ROUTES = [
    { from: '1250', to: '1000' },
    { from: '1000', to: '1250' },
    { from: '1250', to: '3300' },
    { from: '3300', to: '1250' }
  ];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let stations = [];        // { id, name }
  let routes = [];          // { from, to }
  let activeIndex = 0;
  let selectedDate = '';    // 目前選取的日期（YYYY-MM-DD，台灣時間）
  let trains = [];          // 目前路線、日期的班次
  let loadedKey = '';       // 目前班次對應的路線 + 日期
  let typeFilter = new Set();   // 車種篩選，空集合 = 全部
  let expanded = new Set();     // 展開停靠站的班次
  let t30 = null, t5 = null;    // 計時器

  // ---------- 儲存 ----------
  function loadRoutes() {
    try {
      const r = JSON.parse(localStorage.getItem(KEY_ROUTES));
      if (Array.isArray(r) && r.length) return r;
    } catch (e) { /* 無法讀取時用預設值 */ }
    return DEFAULT_ROUTES.slice();
  }
  function saveRoutes() {
    try { localStorage.setItem(KEY_ROUTES, JSON.stringify(routes)); } catch (e) { /* ignore */ }
  }

  // ---------- 時間工具（台灣時間） ----------
  function todayTaipei() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });
  }
  function dateFor(offset) {
    const [y, m, d] = todayTaipei().split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + offset)).toISOString().slice(0, 10);
  }
  const MAX_DAYS_AHEAD = 30;
  // 選取日期與今天相差幾天（正數為未來）
  function dayDiff() {
    const [ty, tm, td] = dateFor(0).split('-').map(Number);
    const [sy, sm, sd] = selectedDate.split('-').map(Number);
    return Math.round((Date.UTC(sy, sm - 1, sd) - Date.UTC(ty, tm - 1, td)) / 86400000);
  }
  function isFuture() { return dayDiff() > 0; }
  function weekdayZh(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return ['日', '一', '二', '三', '四', '五', '六'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  }
  function nowMinutesTaipei() {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).format(new Date()).split(':');
    return Number(parts[0]) * 60 + Number(parts[1]);
  }
  const pad = n => String(n).padStart(2, '0');
  const clockOf = m => { const x = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(x / 60))}:${pad(x % 60)}`; };
  const taipeiClock = d => new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).format(d);
  const toMin = hm => {
    const [h, m] = String(hm || '0:0').split(':').map(Number);
    return h * 60 + m;
  };
  const fmtDuration = mins => {
    if (!Number.isFinite(mins) || mins < 0) return '';
    const h = Math.floor(mins / 60), m = mins % 60;
    return h ? `${h} 小時 ${m} 分` : `${m} 分`;
  };
  const nameField = x => (typeof x === 'string' ? x : (x && x.Zh_tw) || '');

  // ---------- 車站 ----------
  function nameOf(id) {
    const s = stations.find(x => x.id === id);
    return s ? s.name : id;
  }

  async function loadStations() {
    try {
      const cached = JSON.parse(sessionStorage.getItem(KEY_STATIONS));
      if (Array.isArray(cached) && cached.length) { stations = cached; return; }
    } catch (e) { /* ignore */ }
    const res = await fetch(API + '/tra/stations');
    const data = await res.json();
    if (!res.ok || !Array.isArray(data.Stations)) throw new Error(data.error || '無法取得車站資料');
    stations = data.Stations.map(s => ({ id: s.StationID, name: s.StationName.Zh_tw }));
    try { sessionStorage.setItem(KEY_STATIONS, JSON.stringify(stations)); } catch (e) { /* ignore */ }
  }

  function fillStationSelects() {
    const opts = stations.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
    $('fromSel').innerHTML = opts;
    $('toSel').innerHTML = opts;
    // 預設選第一條路線以外的站，方便直接新增
    if (stations.length > 1) $('toSel').selectedIndex = Math.min(1, stations.length - 1);
  }

  // ---------- 路線 ----------
  function renderRoutes() {
    $('routes').innerHTML = routes.map((r, i) => `
      <span class="route-chip ${i === activeIndex ? 'active' : ''}" data-index="${i}" role="button" tabindex="0">
        ${esc(nameOf(r.from))} → ${esc(nameOf(r.to))}
        <button class="mv" data-mv="-1" data-i="${i}" type="button" aria-label="往前移" ${i === 0 ? 'disabled' : ''}>‹</button>
        <button class="mv" data-mv="1" data-i="${i}" type="button" aria-label="往後移" ${i === routes.length - 1 ? 'disabled' : ''}>›</button>
        <button class="del" data-del="${i}" type="button" aria-label="刪除此路線">×</button>
      </span>`).join('') || '<span class="today">尚未新增路線</span>';
  }

  // 調整路線順序（與相鄰路線交換），並保留目前選取的路線
  function moveRoute(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= routes.length) return;
    [routes[i], routes[j]] = [routes[j], routes[i]];
    if (activeIndex === i) activeIndex = j;
    else if (activeIndex === j) activeIndex = i;
    saveRoutes();
    renderRoutes();
  }

  // 切換路線或新增/刪除時，回到今天、清除篩選與展開狀態
  function resetView() {
    selectedDate = dateFor(0);
    typeFilter.clear();
    expanded.clear();
  }

  function addRoute() {
    const from = $('fromSel').value;
    const to = $('toSel').value;
    const msg = $('msg');
    msg.textContent = '';
    if (!from || !to) return;
    if (from === to) { msg.textContent = '出發站和到達站不能相同。'; return; }
    if (routes.some(r => r.from === from && r.to === to)) { msg.textContent = '這條路線已經在清單裡了。'; return; }
    routes.push({ from, to });
    saveRoutes();
    activeIndex = routes.length - 1;
    resetView();
    renderRoutes();
    loadTimetable(true);
  }

  function deleteRoute(i) {
    routes.splice(i, 1);
    saveRoutes();
    if (activeIndex >= routes.length) activeIndex = Math.max(0, routes.length - 1);
    resetView();
    renderRoutes();
    if (routes.length) loadTimetable(true);
    else showStatus('請先新增一條路線。');
  }

  // ---------- 班次 ----------
  function showStatus(text) {
    $('status').hidden = false;
    $('status').textContent = text;
    $('next').hidden = true;
    $('types').innerHTML = '';
    $('list').innerHTML = '';
  }

  function setUpdated(at) {
    $('updated').textContent = `資料更新於 ${taipeiClock(new Date(at))}`;
  }

  async function fetchTrains(route, date) {
    const res = await fetch(`${API}/tra/timetable?from=${encodeURIComponent(route.from)}&to=${encodeURIComponent(route.to)}&date=${date}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '載入時刻表失敗');
    const list = [];
    (data.TrainTimetables || []).forEach(t => {
      const stops = t.StopTimes || [];
      const a = stops.find(s => s.StationID === route.from);
      const b = stops.find(s => s.StationID === route.to);
      if (!a || !b || a.StopSequence >= b.StopSequence) return; // 方向不對或路線不經過
      const info = t.TrainInfo || {};
      const depMin = toMin(a.DepartureTime);
      let arrMin = toMin(b.ArrivalTime);
      if (arrMin < depMin) arrMin += 1440; // 跨午夜
      const segment = stops.slice(stops.indexOf(a), stops.indexOf(b) + 1).map(s => ({
        id: s.StationID,
        name: nameField(s.StationName),
        time: s.ArrivalTime || s.DepartureTime || ''
      }));
      list.push({
        no: info.TrainNo || '',
        type: (info.TrainTypeName && info.TrainTypeName.Zh_tw) || '',
        head: info.TripHeadSign || '',
        dep: a.DepartureTime,
        arr: b.ArrivalTime,
        depMin,
        arrMin,
        duration: arrMin - depMin,
        suspended: !!(info.SuspendedFlag || a.SuspendedFlag || b.SuspendedFlag),
        stops: segment
      });
    });
    list.sort((x, y) => x.depMin - y.depMin);
    return list;
  }

  // 即時誤點：所有運行中列車（不分車站），用車次對應；同車次取最新回報
  async function fetchDelays() {
    const map = new Map();
    try {
      const res = await fetch(`${API}/tra/delays`);
      if (!res.ok) return map;
      const payload = await res.json();
      const rows = Array.isArray(payload.data) ? payload.data : [];
      const latest = new Map();
      rows.forEach(r => {
        const no = String(r.TrainNo || '');
        const d = Number(r.DelayTime);
        if (!no || !Number.isFinite(d)) return;
        const at = String(r.SrcUpdateTime || '');
        const prev = latest.get(no);
        if (!prev || at > prev.at) latest.set(no, { d, at });
      });
      latest.forEach((v, k) => map.set(k, v.d));
    } catch (e) { /* 誤點資料失敗時仍顯示時刻表 */ }
    return map;
  }

  function delayHtml(t) {
    if (isFuture()) return '';                      // 未來日期的班次沒有即時資料
    if (t.delay === undefined || t.delay === null) return '<span class="delay nodata">無即時資料</span>';
    if (t.delay > 0) return `<span class="delay late">誤點 ${t.delay} 分</span>`;
    return '<span class="delay ontime">準點</span>';
  }

  // 誤點時顯示實際約到站時間
  function actualHtml(t) {
    if (isFuture() || !(t.delay > 0)) return '';
    return `<div class="actual">約 ${clockOf(t.arrMin + t.delay)} 到</div>`;
  }

  function typeKey(t) {
    return (t.type || '其他').split(/[（(]/)[0].trim() || '其他';
  }

  function readTtCache(key) {
    try {
      const o = JSON.parse(localStorage.getItem('train_tt_' + key));
      return o && Array.isArray(o.trains) && o.trains.length ? o : null;
    } catch (e) { return null; }
  }
  function writeTtCache(key, obj) {
    try { localStorage.setItem('train_tt_' + key, JSON.stringify(obj)); } catch (e) { /* ignore */ }
  }

  async function loadTimetable(force) {
    const route = routes[activeIndex];
    if (!route) { showStatus('請先新增一條路線。'); return; }
    if (dayDiff() < 0) selectedDate = dateFor(0); // 跨日後避免停在過去的日期
    const date = selectedDate;
    const key = `${route.from}-${route.to}-${date}`;
    if (!force && key === loadedKey) { renderTrains(); return; }
    // 有本機快取就先顯示，再背景更新
    const cached = readTtCache(key);
    if (cached) {
      trains = cached.trains;
      loadedKey = key;
      setUpdated(cached.at);
      $('status').hidden = true;
      renderTrains();
    } else {
      showStatus('載入班次中…');
    }
    try {
      const [list, delays] = await Promise.all([
        fetchTrains(route, date),
        isFuture() ? Promise.resolve(new Map()) : fetchDelays()
      ]);
      // 載入期間若已切換路線或日期，丟棄這次結果
      const cur = routes[activeIndex];
      if (!cur || `${cur.from}-${cur.to}-${selectedDate}` !== key) return;
      list.forEach(t => { t.delay = delays.has(t.no) ? delays.get(t.no) : undefined; });
      const at = Date.now();
      trains = list;
      loadedKey = key;
      writeTtCache(key, { at, trains: list });
      setUpdated(at);
      $('status').hidden = true;
      renderTrains();
    } catch (err) {
      if (!cached) {
        trains = [];
        loadedKey = '';
        showStatus('無法載入班次：' + err.message);
      }
    }
  }

  function renderTypes() {
    const keys = [...new Set(trains.map(typeKey))];
    if (keys.length < 2) { $('types').innerHTML = ''; return; }
    $('types').innerHTML = [
      `<button class="chip ${typeFilter.size ? '' : 'on'}" type="button" data-type="">全部</button>`,
      ...keys.map(k => `<button class="chip ${typeFilter.has(k) ? 'on' : ''}" type="button" data-type="${esc(k)}">${esc(k)}</button>`)
    ].join('');
  }

  function stopsHtml(t, route) {
    return `<div class="stops">${t.stops.map(s => {
      const end = s.id === route.from || s.id === route.to;
      return `<div class="stop${end ? ' end' : ''}"><span>${esc(s.name || nameOf(s.id))}</span><span>${esc(s.time)}</span></div>`;
    }).join('')}</div>`;
  }

  function renderTrains() {
    const route = routes[activeIndex];
    const future = isFuture();
    const diff = dayDiff();
    const rel = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === 2 ? '後天' : `週${weekdayZh(selectedDate)}`;
    $('today').textContent = selectedDate.replace(/-/g, '/') + `（${rel}）`;
    syncDayBar();
    if (!route) return;
    if (!trains.length) {
      $('next').hidden = true;
      $('types').innerHTML = '';
      $('list').innerHTML = `<div class="empty">${future ? selectedDate.replace(/-/g, '/') : '今天'} 沒有 ${esc(nameOf(route.from))} → ${esc(nameOf(route.to))} 的班次</div>`;
      return;
    }
    renderTypes();

    const now = future ? -1 : nowMinutesTaipei();
    const visible = trains.filter(t => !typeFilter.size || typeFilter.has(typeKey(t)));
    const upcoming = visible.filter(t => t.depMin >= now && !t.suspended);
    const prev = future ? null : [...visible].reverse().find(t => t.depMin < now && !t.suspended);
    const nextTrain = upcoming[0];
    const nextIdx = visible.indexOf(nextTrain);

    // 前一班 + 接下來三班
    let html = '';
    if (prev) {
      html += `
        <div class="prev-row">
          <div class="label">前一班</div>
          <div class="prev-line"><span class="up-time">${esc(prev.dep)}</span> <span class="up-arr">→ ${esc(prev.arr)}</span> · ${esc(prev.type)} ${esc(prev.no)} 次${prev.head ? ' · ' + esc(prev.head) : ''} ${delayHtml(prev)}</div>
        </div>`;
    }
    if (!visible.length) {
      html += `<div class="label">沒有符合篩選的班次</div>`;
    } else if (upcoming.length) {
      html += `<div class="label">${future ? '當日最早三班' : '接下來三班'}</div>` + upcoming.slice(0, 3).map((t, k) => {
        const wait = t.depMin - now;
        return `
        <div class="up-row${k === 0 ? ' first' : ''}">
          <div class="up-time">${esc(t.dep)} <span class="up-arr">→ ${esc(t.arr)}</span></div>
          <div class="meta">${esc(t.type)} ${esc(t.no)} 次${t.head ? ' · ' + esc(t.head) : ''} · 行車 ${esc(fmtDuration(t.duration))}</div>
          <div class="meta">${future ? '' : `<span class="countdown">${wait <= 0 ? '即將發車' : `還有 ${wait} 分鐘`}</span> `}${delayHtml(t)}</div>
          ${actualHtml(t)}
        </div>`;
      }).join('');
    } else {
      html += `<div class="label">${future ? '當日' : '今天'}已無班次</div>`;
      if (!future) html += `<button class="btn-link" type="button" data-day="1">看明天班次 →</button>`;
    }
    $('next').hidden = false;
    $('next').innerHTML = html;

    // 班次列表（點一下展開停靠站）
    $('list').innerHTML = visible.length ? visible.map((t, i) => {
      const key = `${t.no}-${t.dep}`;
      const open = expanded.has(key);
      const cls = ['train',
        i === nextIdx ? 'next-one' : '',
        t.depMin < now ? 'past' : '',
        t.suspended ? 'suspended' : '',
        open ? 'open' : ''].join(' ');
      return `
        <div class="${cls}" data-key="${esc(key)}" role="button" tabindex="0">
          <div>
            <div class="no">${esc(t.no)}</div>
          </div>
          <div style="min-width:0">
            <div class="type">${esc(t.type)}${t.head ? ' · ' + esc(t.head) : ''}</div>
            <div class="type">行車 ${esc(fmtDuration(t.duration))}${t.suspended ? ' · 停駛' : ''}</div>
          </div>
          <div class="times">${esc(t.dep)} → ${esc(t.arr)}<div>${delayHtml(t)}</div>${actualHtml(t)}</div>
          ${open ? stopsHtml(t, route) : ''}
        </div>`;
    }).join('') : '<div class="empty">沒有符合篩選的班次</div>';
  }

  // ---------- 事件 ----------
  $('addBtn').addEventListener('click', addRoute);
  $('routes').addEventListener('click', e => {
    const mv = e.target.closest('[data-mv]');
    if (mv) { e.stopPropagation(); moveRoute(Number(mv.dataset.i), Number(mv.dataset.mv)); return; }
    const del = e.target.closest('[data-del]');
    if (del) { e.stopPropagation(); deleteRoute(Number(del.dataset.del)); return; }
    const chip = e.target.closest('.route-chip[data-index]');
    if (chip) {
      activeIndex = Number(chip.dataset.index);
      resetView();
      renderRoutes();
      loadTimetable(false);
    }
  });
  $('types').addEventListener('click', e => {
    const b = e.target.closest('[data-type]');
    if (!b) return;
    const k = b.dataset.type;
    if (!k) typeFilter.clear();
    else if (typeFilter.has(k)) typeFilter.delete(k);
    else typeFilter.add(k);
    renderTrains();
  });
  function setDate(dateStr) {
    const min = dateFor(0);
    const max = dateFor(MAX_DAYS_AHEAD);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
    selectedDate = dateStr < min ? min : dateStr > max ? max : dateStr;
    loadTimetable(true);
  }
  function shiftDate(n) {
    const [y, m, d] = selectedDate.split('-').map(Number);
    setDate(new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10));
  }
  function syncDayBar() {
    const diff = dayDiff();
    $('dayPick').value = selectedDate;
    $('dayPick').min = dateFor(0);
    $('dayPick').max = dateFor(MAX_DAYS_AHEAD);
    $('dayPrev').disabled = diff <= 0;
    $('dayNext').disabled = diff >= MAX_DAYS_AHEAD;
    $('dayToday').disabled = diff === 0;
  }
  $('dayPrev').addEventListener('click', () => shiftDate(-1));
  $('dayNext').addEventListener('click', () => shiftDate(1));
  $('dayToday').addEventListener('click', () => setDate(dateFor(0)));
  $('dayPick').addEventListener('change', e => setDate(e.target.value));
  $('next').addEventListener('click', e => {
    const b = e.target.closest('[data-day]');
    if (!b) return;
    setDate(dateFor(1));
  });
  $('list').addEventListener('click', e => {
    const row = e.target.closest('.train[data-key]');
    if (!row) return;
    const k = row.dataset.key;
    if (expanded.has(k)) expanded.delete(k);
    else expanded.add(k);
    renderTrains();
  });

  // 前景每 30 秒更新倒數、每 5 分鐘重抓；切到背景時停止，回到前景立即更新
  function startTimers() {
    stopTimers();
    t30 = setInterval(() => { if (trains.length) renderTrains(); }, 30000);
    t5 = setInterval(() => loadTimetable(true), 5 * 60 * 1000);
  }
  function stopTimers() {
    clearInterval(t30);
    clearInterval(t5);
    t30 = t5 = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopTimers(); return; }
    loadTimetable(true);
    startTimers();
  });

  // ---------- 啟動 ----------
  async function init() {
    routes = loadRoutes();
    renderRoutes();
    selectedDate = dateFor(0);
    syncDayBar();
    // 車站清單與班次同時載入，不互相等待
    const stationsReady = loadStations()
      .then(() => { fillStationSelects(); renderRoutes(); })
      .catch(err => { $('msg').textContent = '車站清單載入失敗：' + err.message; });
    await loadTimetable(true);
    await stationsReady;
    startTimers();
  }
  init();
})();
</script>
</body>
</html>
